[project]
name = "vless-python-proxy"
version = "0.2.0"
description = "Python CLI and TUI for managing VLESS profiles over local SOCKS5/HTTP proxies"
requires-python = ">=3.10"
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # This codebase writes deliberately compact control flow -- `if x: return`
    # one-liners and long assert/raise lines are a house style that predates the
    # linter, carried over verbatim from the original single-file version. Both
    # rules are disabled rather than churning ~40 lines of working, tested code
    # for no behavioural gain. Re-enable them if the style is ever revisited.
    "E701",
    "E501",
]