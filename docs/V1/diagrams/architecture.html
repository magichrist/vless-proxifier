<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V1 module architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;500&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>V1 module architecture and the switching seam</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">V1 module architecture and the switching seam</title>
        <desc id="architecture-desc">Three tiers: a Textual UI and headless CLI call ProxyService, which orchestrates the profile store, the macOS Keychain, the pure link parser and config builder, and the Xray supervisor. The highlighted supervisor is the switching seam that isolates every hot-swap implementation behind apply and stop.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ZONES (painted before arrows and nodes) -->
        <rect x="30" y="68" width="900" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="42" y="72" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="86" y="81" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PRESENTATION</text>

        <rect x="30" y="204" width="900" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="42" y="208" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="90" y="217" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION</text>

        <rect x="30" y="340" width="900" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="42" y="344" width="74" height="12" rx="2" fill="#f5f5f5"/>
        <text x="79" y="353" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CORE</text>

        <!-- ARROWS (drawn before nodes so lines sit behind boxes) -->

        <!-- TUI -> ProxyService -->
        <path d="M 330,156 V 377 Q 330,385 338,385 H 432 Q 440,385 440,393 V 236"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- CLI -> ProxyService -->
        <path d="M 630,156 V 567 Q 630,575 638,575 H 512 Q 520,575 520,583 V 236"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ProxyService -> profiles.json -->
        <line x1="370" y1="264" x2="302" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="312" y="244" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="336" y="253" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PROFILES</text>

        <!-- ProxyService -> Keychain -->
        <line x1="590" y1="264" x2="658" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="604" y="244" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="624" y="253" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UUID</text>

        <!-- ProxyService -> links.py (CONFIG) -->
        <path d="M 444,292 V 397 Q 444,405 436,405 H 338 Q 330,405 330,413 V 372"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="396" y="342" width="38" height="12" rx="2" fill="#f5f5f5"/>
        <text x="415" y="351" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG</text>

        <!-- ProxyService -> xray.py (SPAWN, the seam - accent) -->
        <path d="M 516,292 V 397 Q 516,405 524,405 H 622 Q 630,405 630,413 V 372"
              fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="526" y="342" width="38" height="12" rx="2" fill="#f5f5f5"/>
        <text x="545" y="351" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SPAWN</text>

        <!-- xray.py -> Xray-core -->
        <line x1="630" y1="428" x2="630" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="567" y="458" width="53" height="12" rx="2" fill="#f5f5f5"/>
        <text x="593.5" y="467" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUPERVISE</text>

        <!-- NODES -->

        <!-- TUI -->
        <rect x="230" y="100" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="230" y="100" width="200" height="56" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <rect x="238" y="106" width="50" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
        <text x="263" y="115" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TEXTUAL</text>
        <text x="330" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Textual UI</text>
        <text x="330" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">app &#183; screens &#183; widgets</text>

        <!-- CLI -->
        <rect x="530" y="100" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="530" y="100" width="200" height="56" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <rect x="538" y="106" width="55" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
        <text x="565.5" y="115" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ARGPARSE</text>
        <text x="630" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Headless CLI</text>
        <text x="630" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">vless_proxy.py</text>

        <!-- profiles.json (store) -->
        <rect x="120" y="236" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="236" width="180" height="56" rx="6" fill="#ececec" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="128" y="242" width="41" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
        <text x="148.5" y="251" fill="rgba(45,49,66,0.7)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="210" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">profiles.json</text>
        <text x="210" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0600 &#183; no uuid</text>

        <!-- ProxyService -->
        <rect x="370" y="236" width="220" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="370" y="236" width="220" height="56" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <rect x="378" y="242" width="75" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
        <text x="415.5" y="251" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ORCHESTRATOR</text>
        <text x="480" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">ProxyService</text>
        <text x="480" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">apply() &#183; stop()</text>

        <!-- Keychain (store) -->
        <rect x="660" y="236" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="236" width="180" height="56" rx="6" fill="#ececec" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="668" y="242" width="55" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
        <text x="695.5" y="251" fill="rgba(45,49,66,0.7)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">KEYCHAIN</text>
        <text x="750" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Keychain</text>
        <text x="750" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">uuid &#183; security(1)</text>

        <!-- links.py -->
        <rect x="230" y="372" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="230" y="372" width="200" height="56" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <rect x="238" y="378" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
        <text x="256" y="387" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PURE</text>
        <text x="330" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">links.py</text>
        <text x="330" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">parse &#183; build_config</text>

        <!-- xray.py (accent - the seam) -->
        <rect x="530" y="372" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="530" y="372" width="200" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="538" y="378" width="65" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.4)" stroke-width="0.8"/>
        <text x="570.5" y="387" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SUPERVISOR</text>
        <text x="630" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">xray.py</text>
        <text x="630" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">install &#183; spawn &#183; listen</text>

        <!-- Xray-core (external) -->
        <rect x="530" y="500" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="530" y="500" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="538" y="506" width="55" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
        <text x="565.5" y="515" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
        <text x="630" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Xray-core</text>
        <text x="630" y="550" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verified binary</text>

        <!-- LEGEND -->
        <line x1="30" y1="590" x2="930" y2="590" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="614" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="120" y="602" width="12" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <text x="140" y="612" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">MODULE</text>

        <rect x="300" y="602" width="12" height="12" rx="2" fill="#ececec" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <text x="320" y="612" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">STATE</text>

        <rect x="470" y="602" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="490" y="612" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">SWITCHING SEAM</text>

        <rect x="680" y="602" width="12" height="12" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="700" y="612" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">EXTERNAL</text>
      </svg>
    </div>
  </div>
</body>
</html>
