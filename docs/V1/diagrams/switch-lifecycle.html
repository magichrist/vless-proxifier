<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy switch lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;500&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1160px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine &#183; Lifecycle phase map &#183; Diagram Design</p>
    <h1>Proxy switch lifecycle</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1160 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="switch-lifecycle-title switch-lifecycle-desc">
        <title id="switch-lifecycle-title">Proxy switch lifecycle</title>
        <desc id="switch-lifecycle-desc">Selecting a profile moves the proxy through validation, start, and running states. A rejected configuration returns to running when a tunnel is already live and fails only when nothing was serving. Starting can time out, and a running proxy fails if Xray dies.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- START dot -->
        <circle cx="480" cy="30" r="6" fill="#2d3142"/>

        <!-- TRANSITIONS (drawn before nodes) -->

        <!-- start -> validating -->
        <path d="M 480,36 V 56" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- validating -> starting (CONFIG OK) -->
        <path d="M 455,112 V 161 Q 455,169 447,169 H 348 Q 340,169 340,177 V 190"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="392" y="130" width="53" height="12" rx="2" fill="#f5f5f5"/>
        <text x="418.5" y="139" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG OK</text>

        <!-- validating -> failed (INVALID, cold) -->
        <path d="M 505,112 V 161 Q 505,169 513,169 H 772 Q 780,169 780,177 V 190"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="620" y="149" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="642" y="158" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INVALID</text>

        <!-- validating -> running (INVALID, keep old; bridged over SELECT) -->
        <path d="M 405,92 H 188 Q 180,92 180,100 V 326 a 8,8 0 0,0 0,16 Q 180,342 188,342 H 265"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="127" y="203" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="149" y="212" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INVALID</text>

        <!-- starting -> running (LISTENER UP) -->
        <path d="M 340,242 V 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="350" y="263" width="63" height="12" rx="2" fill="#f5f5f5"/>
        <text x="381.5" y="272" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LISTENER UP</text>

        <!-- starting -> failed (TIMEOUT) -->
        <line x1="415" y1="216" x2="701" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="538" y="196" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="205" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TIMEOUT</text>

        <!-- running -> validating (SELECT) -->
        <path d="M 265,316 H 108 Q 100,316 100,308 V 84 Q 100,76 108,76 H 401"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="52" y="190" width="38" height="12" rx="2" fill="#f5f5f5"/>
        <text x="71" y="199" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SELECT</text>

        <!-- running -> failed (XRAY DIES) -->
        <path d="M 415,326 H 872 Q 880,326 880,318 V 224 Q 880,216 872,216 H 859"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="890" y="261" width="54" height="12" rx="2" fill="#f5f5f5"/>
        <text x="917" y="270" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">XRAY DIES</text>

        <!-- running -> end (QUIT) -->
        <path d="M 340,352 V 411" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="350" y="376" width="29" height="12" rx="2" fill="#f5f5f5"/>
        <text x="364.5" y="385" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">QUIT</text>

        <!-- END dot (ringed) -->
        <circle cx="340" cy="420" r="8" fill="none" stroke="#2d3142" stroke-width="1.4"/>
        <circle cx="340" cy="420" r="5" fill="#2d3142"/>

        <!-- STATES -->

        <!-- validating -->
        <rect x="405" y="60" width="150" height="52" rx="8" fill="#f5f5f5"/>
        <rect x="405" y="60" width="150" height="52" rx="8" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <text x="480" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">validating</text>
        <text x="480" y="99" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">build &#183; xray -test</text>

        <!-- starting -->
        <rect x="265" y="190" width="150" height="52" rx="8" fill="#f5f5f5"/>
        <rect x="265" y="190" width="150" height="52" rx="8" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <text x="340" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">starting</text>
        <text x="340" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">spawn &#183; wait</text>

        <!-- running -->
        <rect x="265" y="300" width="150" height="52" rx="8" fill="#f5f5f5"/>
        <rect x="265" y="300" width="150" height="52" rx="8" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <text x="340" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">running</text>
        <text x="340" y="339" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">serving traffic</text>

        <!-- failed (accent) -->
        <rect x="705" y="190" width="150" height="52" rx="8" fill="#f5f5f5"/>
        <rect x="705" y="190" width="150" height="52" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="780" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">failed</text>
        <text x="780" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no listener</text>

        <!-- CALLOUTS -->
        <circle cx="446" cy="473" r="3" fill="#bf4520"/>
        <text x="462" y="478" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Validation runs before teardown &#8212; a rejected profile never kills a live tunnel.</text>

        <circle cx="446" cy="506" r="3" fill="#bf4520"/>
        <text x="462" y="511" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Retry: selecting any profile resumes at validating.</text>

        <!-- LEGEND -->
        <line x1="30" y1="540" x2="1130" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <circle cx="132" cy="560" r="5" fill="#2d3142"/>
        <text x="146" y="564" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">START / END</text>

        <rect x="290" y="552" width="16" height="16" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <text x="314" y="564" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">STATE</text>

        <rect x="440" y="552" width="16" height="16" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="464" y="564" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">FAILURE</text>
      </svg>
    </div>
  </div>
</body>
</html>
